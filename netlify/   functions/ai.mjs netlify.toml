export default async (request) => {
  const headers = {
    "Content-Type": "application/json"
  };

  if (request.method !== "POST") {
    return new Response(
      JSON.stringify({ error: "Gunakan metode POST." }),
      { status: 405, headers }
    );
  }

  try {
    const apiKey = Netlify.env.get("GEMINI_API_KEY");

    if (!apiKey) {
      return new Response(
        JSON.stringify({ error: "API Key belum dipasang di Netlify." }),
        { status: 500, headers }
      );
    }

    const body = await request.json();
    const message = String(body.message || "").trim();
    const mode = String(body.mode || "chat");

    if (!message || message.length > 5000) {
      return new Response(
        JSON.stringify({ error: "Pesan kosong atau terlalu panjang." }),
        { status: 400, headers }
      );
    }

    const prompts = {
      chat: "Kamu adalah MOON AI, asisten yang ramah, cerdas dan membantu. Jawab dalam bahasa pengguna.",
      caption: "Buat caption media sosial yang menarik berdasarkan permintaan pengguna.",
      translate: "Terjemahkan teks pengguna dengan mempertahankan makna dan gaya bahasanya.",
      assistant: "Kamu adalah asisten pribadi yang membantu menyelesaikan berbagai pertanyaan.",
      writer: "Bantu pengguna menulis teks yang rapi, kreatif dan sesuai permintaan.",
      code: "Kamu adalah asisten pemrograman. Jelaskan dan bantu membuat kode dengan aman."
    };

    const systemPrompt = prompts[mode] || prompts.chat;

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: systemPrompt }]
          },
          contents: [{
            role: "user",
            parts: [{ text: message }]
          }],
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 1500
          }
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      console.error("Gemini API error:", data.error?.message);
      return new Response(
        JSON.stringify({ error: "AI gagal memproses permintaan. Periksa konfigurasi API." }),
        { status: 502, headers }
      );
    }

    const result = data.candidates?.[0]?.content?.parts
      ?.map(part => part.text || "")
      .join("") || "AI belum memberikan jawaban.";

    return new Response(
      JSON.stringify({ reply: result }),
      { status: 200, headers }
    );

  } catch (error) {
    console.error("Function error:", error);

    return new Response(
      JSON.stringify({ error: "Terjadi kesalahan pada server MOON AI." }),
      { status: 500, headers }
    );
  }
};
